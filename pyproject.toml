[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-doc-triage"
version = "0.2.0"
description = "Bounded accounting evidence intake, parsing, and triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
docling = [
  "docling>=2.123,<3",
]

[project.scripts]
accounting-doc-triage = "accounting_doc_triage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
