# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: acct.intake.documents
repository:
  id: repo.accounting-doc-triage
  github: matuteiglesias/accounting-doc-triage
domain: accounting
system: acct.intake
role: accounting-evidence-intake
lifecycle: active
authority:
  status: proposed
  owns:
  - accounting document intake and safe evidence custody
  - content identity and parser/run provenance
  - accounting-document observations and review candidates
  - approved transaction-evidence relation production
  does_not_own:
  - canonical ledger semantics or transaction identity
  - accounting facts created merely from document extraction
  - professional reporting calculations
  - generic estate-wide document ingestion
  - repository health
  - viewer presentation or private-evidence publication policy
interfaces:
  consumes: []
  produces:
  - artifact:acct.document-candidate@1
  - artifact:acct.transaction-evidence@1
upstream: []
downstream:
- repo.accounting-workflows
canonical_commands:
- python -m pytest
- python -m accounting_doc_triage.cli --help
generated_paths:
- out/
- runs/
verification:
  status: partial
  last_verified: '2026-08-30'
  command: python -m pytest
  unknowns:
  - real Docling conversion requires the optional docling dependency and local model/runtime availability
  - live external data-root mutation requires an explicit execution packet and is not exercised by repository tests
  - transaction-evidence matching remains candidate/review state until explicitly approved
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
